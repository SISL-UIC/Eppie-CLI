name: Build and Test
env:
  project: src/Eppie.CLI/Eppie.CLI/Eppie.CLI.csproj
  test-project: src/Eppie.CLI/Eppie.CLI.Tests/Eppie.CLI.Tests.csproj
  test-report-root: src/Eppie.CLI/TestResults
  dotnet-version: 10.x
  PYTHONPATH: /tmp/instr
  BASH_ENV: /tmp/instr/bash_env.sh
jobs:
  coding-style:
    runs-on: self-hosted
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        fetch-depth: 0
        submodules: recursive
    - name: Install dotnet
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
      with:
        dotnet-version: ${{ env.dotnet-version }}
    - name: Check formatting
      run: dotnet format ${{ env.project }} --verify-no-changes
    timeout-minutes: 6
  build:
    needs:
    - coding-style
    strategy:
      matrix:
        include:
        - configuration: Debug
          os: ubuntu-latest
      fail-fast: false
    runs-on: self-hosted
    env:
      configuration: ${{ matrix.configuration }}
    steps:
    - name: Support longpaths
      if: ${{ matrix.os == 'windows-latest'}}
      run: git config --system core.longpaths true
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      with:
        fetch-depth: 0
        submodules: recursive
    - name: Install dotnet
      uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
      with:
        dotnet-version: ${{ env.dotnet-version }}
    - name: Build
      run: dotnet build ${{ env.project }} --configuration ${{ env.configuration }}
    - name: Test
      if: env.test-project != ''
      run: dotnet test ${{ env.test-project }} --configuration ${{ env.configuration
        }} --collect:"XPlat Code Coverage" --results-directory="${{ env.test-report-root
        }}"
    - name: Get branch name
      if: ${{ env.test-project != '' && runner.os == 'Linux' }}
      id: branch
      run: |
        branch=$(echo "$GITHUB_REF_NAME")
        name=$([ -z $branch ] && echo "unknown" || echo "$branch" | sed -r 's/[\/]+/-/g')
        echo "name=$name" >> $GITHUB_OUTPUT
    - name: Generate test coverage badge
      if: ${{ env.test-project != '' && runner.os == 'Linux' && env.gist-id != ''
        && env.gist-auth-token != '' }}
      uses: finebits/github-actions/badges/coverlet-coverage-badge@3b3b9346c9a22b70e763cbe808ea82eb1e3e8afd
      with:
        label: coverage
        report-root: ${{ env.test-report-root }}/**/
        report-filename: coverage.cobertura.xml
        gist-filename-format: ${{ github.event.repository.name }}-${{ env.branch-name
          }}-{0}-test-coverage.json
        gist-id: ${{ env.gist-id }}
        gist-auth-token: ${{ env.gist-auth-token }}
      env:
        gist-id: ${{ vars.BADGE_COVERLET_COVERAGE_GIST_ID }}
        gist-auth-token: ${{ secrets.TOKEN_GITHUB_GIST }}
        branch-name: ${{ steps.branch.outputs.name }}
    timeout-minutes: 6
    if: ${{ !cancelled() }}
'on':
  push:
    branches:
    - main
    - develop
    - release/**
  pull_request:
    branches:
    - main
    - develop
    - release/**
